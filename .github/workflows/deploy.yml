# Rebuilds and publishes the website on every push to main
# (including every "Publish changes" from the /admin panel).
name: Build & publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resize photos (incl. new admin uploads)
        run: npm run images
      - name: Build static site
        env:
          CNAME: ${{ vars.CNAME }} # custom domain, e.g. lancetarchitect.com (optional)
          SITE_URL: ${{ vars.SITE_URL }}
          OWNER: ${{ github.repository_owner }}
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          NEXT_PUBLIC_FORM_ACCESS_KEY: ${{ vars.FORM_ACCESS_KEY }}
        run: |
          if [ -n "$CNAME" ]; then
            export NEXT_PUBLIC_BASE_PATH=""; DEFAULT_URL="https://$CNAME"
          else
            export NEXT_PUBLIC_BASE_PATH="/$REPO_NAME"; DEFAULT_URL="https://$OWNER.github.io/$REPO_NAME"
          fi
          export NEXT_PUBLIC_SITE_URL="${SITE_URL:-$DEFAULT_URL}"
          echo "Building $NEXT_PUBLIC_SITE_URL (base path '$NEXT_PUBLIC_BASE_PATH')"
          npm run build
      - name: Publish to the gh-pages branch
        env:
          CNAME: ${{ vars.CNAME }}
        run: |
          touch out/.nojekyll
          if [ -n "$CNAME" ]; then echo "$CNAME" > out/CNAME; fi
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
